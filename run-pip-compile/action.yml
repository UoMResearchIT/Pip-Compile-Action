name: "Run pip-compile"
description: "Install pip-tools and run pip-compile on a single input file and output file."
inputs:
  input-file:
    description: "The input file to compile. Defaults to pyproject.toml. Supports files such as pyproject.toml or requirements.in."
    required: false
    default: "pyproject.toml"
  output-file:
    description: "The output file to generate. Defaults to requirements.txt."
    required: false
    default: "requirements.txt"
  pip-tools-version:
    description: "The version of pip-tools to install. If not specified, the most recent version will be installed."
    required: false
    default: ""
  pip-version:
    description: "The pip version to install. Use 'latest' to opt in to newest pip. Default keeps deterministic behavior."
    required: false
    default: "24.2"
  pip-compile-args:
    description: "Additional arguments to pass to pip-compile."
    required: false
    default: ""
outputs:
  CHANGES_DETECTED:
    description: "A flag indicating whether the requirements files have changed."
    value: ${{ steps.detect-changes.outputs.CHANGES_DETECTED }}
  OUTPUT_FILES:
    description: "The names of the output files generated by pip-compile."
    value: ${{ steps.get-output-files.outputs.OUTPUT_FILES }}

runs:
  using: "composite"
  steps:

      - name: Symlink current action repo
        env:
          action_path: ${{ github.action_path }}
        run: |
          if [[ ! -d .github/.action_repo ]]; then ln -fs ${{ env.action_path }}/.. .github/.action_repo; fi
        shell: bash
      
      - name: Get pip-tools version suffix
        id: get-pip-tools-version-suffix
        run: |
          if [[ -z "${{ inputs.pip-tools-version }}" ]];
          then
            echo "using latest version of pip-tools";
            echo "PIP_TOOLS_VERSION=pip-tools" >> $GITHUB_OUTPUT;
          else
            echo "using version ${{ inputs.pip-tools-version }} of pip-tools";
            echo "PIP_TOOLS_VERSION=pip-tools==${{ inputs.pip-tools-version }}" >> $GITHUB_OUTPUT;
          fi
        shell: bash
      
      - name: Install pip-tools
        # The latest version of pip and pip-tools creates absolute paths instead of relative paths
        # when compiling requirements files.
        # Set pip version 24.2 as default version
        run: |
          if [[ "${{ inputs.pip-version }}" == "latest" ]]; then
            pip install --upgrade pip
          else
            pip install --upgrade "pip==${{ inputs.pip-version }}"
          fi
          pip install ${{ steps.get-pip-tools-version-suffix.outputs.PIP_TOOLS_VERSION }}
        shell: bash
      
      - name: Resolve input and output file paths
        id: resolve-output-file
        run: |
          input_file="${{ inputs.input-file }}"
          output_file="${{ inputs.output-file }}"

          echo "INPUT_FILE=$input_file" >> $GITHUB_OUTPUT
          echo "OUTPUT_FILE=$output_file" >> $GITHUB_OUTPUT
          echo "OUTPUT_FILES=$output_file" >> $GITHUB_OUTPUT
        shell: bash  

      - name: Run pip-compile
        run: |
          pip-compile \
            ${{ inputs.pip-compile-args }} \
            -o "${{ steps.resolve-output-file.outputs.OUTPUT_FILE }}" \
            "${{ steps.resolve-output-file.outputs.INPUT_FILE }}"
        shell: bash
        
      - name: Detect if any changes were made to the output file
        id: detect-changes
        run: |
          function check() {
            if [[ -z "$(git status --porcelain  ${{ steps.get-output-files.outputs.OUTPUT_FILES}})" ]];
            then
              echo "0"
            else
              echo "1"
            fi
          }

          echo "CHANGES_DETECTED=$(check)" >> $GITHUB_OUTPUT
        shell: bash

      - name: List changes
        if: steps.detect-changes.outputs.CHANGES_DETECTED
        run: |
          git status ${{ steps.get-output-files.outputs.OUTPUT_FILES}}
          git diff ${{ steps.get-output-files.outputs.OUTPUT_FILES}}
        shell: bash